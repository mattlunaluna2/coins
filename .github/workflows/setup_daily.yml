name: SETUP DAILY

permissions:
  contents: write

on:
  schedule:
    # Cada 4 horas (2:05, 6:05, 10:05, 14:05, 18:05, 22:05 UTC)
    - cron: '5 2,6,10,14,18,22 * * * *'
  workflow_dispatch:

concurrency:
  group: repo-main-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check syntax
        run: python -m py_compile setup_daily.py

      - name: Run Setup Daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINBEACON_TOKEN: ${{ secrets.COINBEACON_TOKEN }}
        run: python setup_daily.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/setup_daily_state.json ]; then
            git add data/setup_daily_state.json
          fi
          if [ -f data/setup_daily_log.jsonl ]; then
            git add data/setup_daily_log.jsonl
          fi

          if git diff --staged --quiet; then
            echo "📭 Sin cambios"
          else
            git commit -m "setup_daily: update [skip ci]"

            for i in 1 2 3; do
              git pull --rebase origin main && break
              sleep 5
            done

            for i in 1 2 3; do
              git push && echo "✅ Push OK" && break
              git pull --rebase origin main || true
              sleep 10
            done
          fi
