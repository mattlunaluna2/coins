name: Recolector Alts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolector-alts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run recolector
        run: |
          echo "🚀 RECOLECTOR ALTS"
          date -u
          python -u recolector_alts.py
          date -u

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "📭 Sin cambios"
            exit 0
          fi

          git commit -m "data: recolector alts $(date -u +%Y-%m-%dT%H:%M)"

          for i in 1 2 3; do
            echo "🔄 Push intento $i..."
            git pull --rebase origin main && \
            git push origin HEAD:main && \
            echo "✅ Push OK" && \
            exit 0
            echo "⚠️ Falló, esperando..."
            sleep 10
          done

          echo "❌ No se pudo hacer push"
          exit 1
